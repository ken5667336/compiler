name: Compiler Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clone repo
        run: |
          git clone https://github.com/stablemarkk/rpow_cli_miner.git
          cd rpow_cli_miner
          ls -la

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nodejs

      - name: Build native C miner
        run: |
          cd rpow_cli_miner
          gcc -O3 -march=native -pthread rpow-native-miner.c -o rpow-native-miner
          chmod +x rpow-native-miner

      - name: Verify binary
        run: |
          cd rpow_cli_miner
          ls -lh rpow-native-miner
          file rpow-native-miner

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp rpow_cli_miner/rpow-native-miner dist/
          cp rpow_cli_miner/rpow-cli.js dist/
          cp rpow_cli_miner/rpow-miner-worker.js dist/
          cp rpow_cli_miner/index.js dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v01"
          name: "Version 01"
          files: |
            dist/rpow-native-miner
            dist/rpow-cli.js
            dist/rpow-miner-worker.js
            dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
